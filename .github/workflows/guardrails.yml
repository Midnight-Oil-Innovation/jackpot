name: Guardrails
on: [pull_request]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: STATUS block is current
        run: |
          uv run python scripts/gen_status.py
          git diff --exit-code docs/STATUS.md \
            || (echo "STATUS.md is stale. Run 'make status' and commit."; exit 1)

      - name: Doc drift guard
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'docs/**/*.md' 'docs/*.md' '*.md')
          if [ -n "$CHANGED" ]; then
            echo "Checking changed markdown:"; echo "$CHANGED"
            uv run python scripts/check_docs.py $CHANGED
          else
            echo "No markdown changed; skipping doc guard."
          fi

      - name: Single Alembic head
        run: uv run python scripts/check_migration_heads.py

      - name: License compatibility — Python deps (AGPL gate, enforcing)
        # Enforcing. The Python half is clean across all resolved packages, so a new
        # AGPL-incompatible dependency fails the build here. Packages that declare no
        # usable license metadata are resolved by a row in THIRD_PARTY_LICENSES.md.
        run: uv run python scripts/verify_licenses.py --skip-wrapped-tools

      - name: License compatibility — wrapped tools (AGPL gate, report-only)
        # REPORT-ONLY until B-LICENSE-1 foundation-model license verification is done.
        # Flip back to enforcing (drop --report) once THIRD_PARTY_LICENSES.md has real
        # SPDX ids for the (verify) placeholders. Tracked: B-LICENSE-1.
        run: uv run python scripts/verify_licenses.py --skip-python --report

      # - name: Dependency vulnerabilities
      #   run: npx @clidey/deptrust@0.x.y check .
