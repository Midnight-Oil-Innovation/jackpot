name: Test & Lint

on:
  push:
    branches: [main, development, staging]
    paths:
      - 'backend/**'
      - 'cli/**'
      - 'schema/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  pull_request:
    # Branching workflow per docs/CLAUDE.md "Current Baseline":
    # feature PRs target `development` (the integration branch);
    # release PRs target `main` (development → main). Both run CI.
    branches: [development, main]
    paths:
      - 'backend/**'
      - 'cli/**'
      - 'schema/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend + workspace tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     jackpot
          POSTGRES_PASSWORD: jackpot
          POSTGRES_DB:       jackpot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --frozen

      - name: Run pre-commit hooks
        # .pre-commit-config.yaml lives at the workspace root (moved
        # from backend/ during the P0d follow-up). The pre-commit binary
        # comes from backend's dev dependency group via uv sync.
        run: SKIP=docs-guard uv run pre-commit run --all-files

      - name: Run Alembic migrations against the CI Postgres
        env:
          DATABASE_URL: postgresql://jackpot:jackpot@localhost:5432/jackpot_test
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Pre-pull test container images
        # testcontainers pulls lazily, inside the test run, so a registry blip
        # reds the job with a traceback unrelated to the diff under review.
        #
        # What this does and does not fix, because the distinction matters:
        # the RETRY is the fix, and pre-pulling is only the place to hang it
        # (testcontainers exposes no retry hook). It helps the transient class
        # — a quay.io 404 on a tag that had worked an hour earlier, seen on
        # PR #236's run and green on a bare re-run. It does NOT help when an
        # image is withdrawn, as minio/minio was when MinIO dropped the Docker
        # Hub namespace (fixed by moving to quay.io in #232); no retry
        # resurrects a deleted tag, and there this step only relocates the
        # error somewhere more legible.
        #
        # postgres:16 is already pulled by GitHub for the `services:` container
        # before any step runs, so listing it here is a no-op kept for the sake
        # of one list rather than two.
        #
        # That list comes from tests/container_images.py, which the fixtures
        # import — a copy here would drift silently, still green while pulling
        # images nothing uses.
        run: |
          pull() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              echo "pull failed: $1 (attempt $attempt)"
              # No backoff after the final attempt — it would burn 15s to
              # reach a failure already decided.
              [ "$attempt" = 3 ] || sleep $((attempt * 5))
            done
            return 1
          }
          # Command substitution, not a pipe into `while`: the loop body must
          # be able to fail the step, and a pipeline would both swallow `exit`
          # in a subshell and mask a failure of the list command itself.
          images=$(uv run python tests/container_images.py)
          # Guard the guard (Rule 74). An empty list makes the loop body never
          # run and the step pass having pulled nothing — silence that looks
          # exactly like success, which is the failure this step's own comment
          # warns about for a drifted copy.
          [ -n "$images" ] || { echo "::error::image list came back empty"; exit 1; }
          for image in $images; do
            pull "$image" || { echo "::error::could not pull $image after 3 attempts"; exit 1; }
          done

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://jackpot:jackpot@localhost:5432/jackpot_test
          ENV: local
        run: uv run pytest --cov=backend --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  cli-test:
    name: CLI tests (separate coverage scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --frozen

      - name: Run cli tests
        working-directory: cli
        run: uv run pytest --cov=jackpot --cov-fail-under=45

  pipelines-test:
    name: Pipelines parser tests (jackpot-nf)
    runs-on: ubuntu-latest
    # pipelines/ keeps its own pyproject.toml outside the workspace per
    # the P0d plan. Run its tests in their own job so a parser change
    # does not need to flow through the backend test matrix.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install pipelines dependencies (member-local lock + dev extras)
        working-directory: pipelines
        run: uv sync --extra dev

      - name: Run pipelines pytest (excludes integration markers)
        working-directory: pipelines
        run: uv run pytest
