name: Test & Lint

on:
  push:
    branches: [main, development, staging]
    paths:
      - 'backend/**'
      - 'cli/**'
      - 'schema/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'
  pull_request:
    # Branching workflow per docs/CLAUDE.md "Current Baseline":
    # feature PRs target `development` (the integration branch);
    # release PRs target `main` (development → main). Both run CI.
    branches: [development, main]
    paths:
      - 'backend/**'
      - 'cli/**'
      - 'schema/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend + workspace tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     jackpot
          POSTGRES_PASSWORD: jackpot
          POSTGRES_DB:       jackpot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --frozen

      - name: Run pre-commit hooks
        # .pre-commit-config.yaml lives at the workspace root (moved
        # from backend/ during the P0d follow-up). The pre-commit binary
        # comes from backend's dev dependency group via uv sync.
        run: SKIP=docs-guard uv run pre-commit run --all-files

      - name: Run Alembic migrations against the CI Postgres
        env:
          DATABASE_URL: postgresql://jackpot:jackpot@localhost:5432/jackpot_test
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Pre-pull test container images
        # testcontainers pulls these lazily inside the test run, so a registry
        # hiccup reds the whole job with an error unrelated to the diff. Twice
        # in one week: minio/minio vanished when MinIO withdrew the Docker Hub
        # namespace (#232), then quay.io 404'd transiently on a tag that had
        # worked an hour earlier (#236, green on a bare re-run).
        #
        # The list comes from tests/container_images.py, which the fixtures
        # themselves use — a second copy here would drift silently, still
        # passing while quietly pulling nothing the tests need.
        run: |
          pull() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              echo "pull failed: $1 (attempt $attempt)"
              sleep $((attempt * 5))
            done
            return 1
          }
          # Command substitution, not a pipe into `while`: the loop body must
          # be able to fail the step, and a pipeline would both swallow `exit`
          # in a subshell and mask a failure of the list command itself.
          images=$(uv run python tests/container_images.py)
          for image in $images; do
            pull "$image" || { echo "::error::could not pull $image after 3 attempts"; exit 1; }
          done

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://jackpot:jackpot@localhost:5432/jackpot_test
          ENV: local
        run: uv run pytest --cov=backend --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  cli-test:
    name: CLI tests (separate coverage scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --frozen

      - name: Run cli tests
        working-directory: cli
        run: uv run pytest --cov=jackpot --cov-fail-under=45

  pipelines-test:
    name: Pipelines parser tests (jackpot-nf)
    runs-on: ubuntu-latest
    # pipelines/ keeps its own pyproject.toml outside the workspace per
    # the P0d plan. Run its tests in their own job so a parser change
    # does not need to flow through the backend test matrix.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # python-version was added in setup-uv v4. On v3 this input was
          # silently ignored and CI resolved to the runner's system Python
          # (3.12.3) instead of the declared 3.11 target.
          python-version: "3.12"

      - name: Install pipelines dependencies (member-local lock + dev extras)
        working-directory: pipelines
        run: uv sync --extra dev

      - name: Run pipelines pytest (excludes integration markers)
        working-directory: pipelines
        run: uv run pytest
