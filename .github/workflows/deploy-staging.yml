name: deploy-staging

on:
  push:
    branches: [staging]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'pipelines/**'
      - 'schema/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Operator-specific identifiers come from GitHub Actions repo/env vars
  # so the workflow stays operator-agnostic per Critical Rule 55. Set
  # GCP_CLUSTER_NAME, GCP_NAMESPACE, GCP_SECRET_PREFIX in the repo's
  # `staging` environment vars.
  CLUSTER_NAME:    ${{ vars.GCP_CLUSTER_NAME }}
  NAMESPACE:       ${{ vars.GCP_NAMESPACE }}
  RELEASE_NAME:    jackpot-api
  HELM_CHART_PATH: ./deploy/helm/jackpot-api
  VALUES_FILE:     ./deploy/helm/jackpot-api/values-staging.yaml
  SECRET_PREFIX:   ${{ vars.GCP_SECRET_PREFIX }}

jobs:
  deploy:
    name: Build, migrate, and deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api.staging.jackpot.example.org
    steps:
      # Single checkout — the monorepo holds backend, deploy, schema,
      # pipelines, and cli together. The pre-P0d cross-repo checkout +
      # PAT-injected submodule init is no longer needed (P0d retired
      # the submodule layout in favour of subtree merges).
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Resolve image tag
        id: tag
        # IMAGE_TAG_INPUT is read from env, not from `${{ ... }}`
        # interpolation, so a malicious workflow_dispatch caller cannot
        # inject shell commands via the input value. Validated against
        # an allow-list of safe characters before use.
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -n "${IMAGE_TAG_INPUT}" ]]; then
            if [[ ! "${IMAGE_TAG_INPUT}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::image_tag contains disallowed characters"
              exit 1
            fi
            echo "tag=${IMAGE_TAG_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/jackpot/jackpot-api:${{ steps.tag.outputs.tag }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Build context is the backend/ subtree so backend/Dockerfile.api
          # finds its sibling files (backend/, db/, alembic.ini) at the
          # paths it already expects.
          docker build -f backend/Dockerfile.api -t "$IMAGE" backend

      - name: Push API image
        run: docker push "$IMAGE"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Ensure namespace exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync Kubernetes Secret from Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Stage each secret value to a per-key temp file then read it
          # back into the kubectl invocation via --from-file. This avoids
          # shell-metacharacter expansion of secret values that contain
          # `$()` or backticks, and prevents the value from appearing on
          # any process command line.
          declare -a keys=(SECRET_KEY DATABASE_URL GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET NCBI_API_KEY)
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          args=()
          for k in "${keys[@]}"; do
            secret_name="${SECRET_PREFIX}-$(echo "$k" | tr '[:upper:]_' '[:lower:]-')"
            gcloud secrets versions access latest \
              --secret="$secret_name" \
              --project="$GCP_PROJECT_ID" \
              > "$tmpdir/$k"
            args+=(--from-file="$k=$tmpdir/$k")
          done
          kubectl -n "$NAMESPACE" create secret generic jackpot-api-secrets \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade (runs alembic as pre-upgrade hook, then rolls Deployment)
        run: |
          helm upgrade --install "$RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$NAMESPACE" \
            --values "$VALUES_FILE" \
            --set image.tag="${{ steps.tag.outputs.tag }}" \
            --wait --timeout 10m

      - name: Smoke test (via kubectl port-forward)
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/jackpot-api 8080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 http://localhost:8080/health; then
              break
            fi
            sleep 1
          done
          bash ./deploy/scripts/staging_smoke_test.sh
        env:
          JACKPOT_API_URL: http://localhost:8080
