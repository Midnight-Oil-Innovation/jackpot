[project]
name = "jackpot"
version = "0.1.0"
description = "JACKPOT SDK and CLI — programmatic access to the JACKPOT pathogen genomics platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "JACKPOT Maintainers" }]

dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "toml>=0.10.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
    # ed25519 federation keypair generation for Scenarios E + T
    # (jackpot init secrets, P0e Decision 5).
    "pynacl>=1.5",
    # `jackpot init` writers + scenarios; jackpot_scenarios lives inside
    # the schema workspace member.
    "jackpot-schema",
]

[tool.uv.sources]
jackpot-schema = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "ruff==0.11.6",
    "pre-commit>=3.7.0",
]

[project.scripts]
jackpot = "jackpot.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# CLI/SDK stub modules — see cli/pyproject.toml [tool.coverage.run]
# omit list. F841 unused-variable is the typical shape of a stub
# method that builds a params/client dict and raises NotImplementedError.
# Drop the per-file ignore once the corresponding stub is implemented.
"jackpot/sdk/*.py" = ["F841"]
"jackpot/cli/auth.py"      = ["F841"]
"jackpot/cli/upload.py"    = ["F841"]
"jackpot/cli/samples.py"   = ["F841"]
"jackpot/cli/pipelines.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jackpot --cov-report=term-missing --cov-fail-under=45"

[tool.coverage.run]
# SDK modules and CLI commands that raise NotImplementedError are stubs
# waiting for API endpoints. Remove from omit list as each is implemented.
omit = [
    "jackpot/sdk/samples.py",
    "jackpot/sdk/pipelines.py",
    "jackpot/sdk/datasets.py",
    "jackpot/sdk/sra.py",
    "jackpot/sdk/references.py",
    "jackpot/sdk/session.py",
    "jackpot/cli/pipelines.py",
    "jackpot/cli/samples.py",
    "jackpot/cli/auth.py",
    "jackpot/cli/upload.py",
]

# Coverage threshold history — raise as stubs are implemented:
#   v0.1.0 (April 2026): 45% — initial structure, most methods are stubs
#   Month 1 target: 65% — ingest + search endpoints implemented
#   Month 2 target: 75% — pipeline + workspace endpoints implemented
