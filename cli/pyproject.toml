[project]
name = "jackpot"
version = "0.1.0"
description = "JACKPOT SDK and CLI — programmatic access to the JACKPOT pathogen genomics platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Glen Otero", email = "gotero@linuxprophet.com" },
]

dependencies = [
    "httpx>=0.27.0",        # HTTP client for API calls (async-capable)
    "click>=8.1.0",         # CLI framework
    "pydantic>=2.0.0",      # Data validation (shared with jackpot-backend)
    "rich>=13.0.0",         # Terminal output formatting
    "toml>=0.10.2",         # Config file parsing (~/.jackpot/config.toml)
    "python-dateutil>=2.9.0",  # Date parsing for CLI arguments
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",  # Mock httpx calls in tests
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
jackpot = "jackpot.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jackpot --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = []
