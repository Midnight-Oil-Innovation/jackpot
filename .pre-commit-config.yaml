repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Disabled during local dev — re-enable before GCP deployment
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Pyright config + jackpot-course HTML use trailing whitespace
        # in <pre> blocks intentionally; don't strip those.
        # .gz: these hooks are byte-level and do not detect binaries — the
        # end-of-file-fixer appends a newline to anything not ending in one,
        # which corrupts the PHIN VADS snapshot archives.
        exclude: '\.(html|htm|gz)$|^docs/STATUS\.md$'
      - id: end-of-file-fixer
        exclude: '\.(html|htm|gz)$|^docs/STATUS\.md$'
      - id: check-yaml
        # Helm templates use Go template syntax that isn't valid YAML
        # to a basic parser. Excluded from this hook; rely on
        # `helm lint` in the deploy workflow for Helm template
        # validation. CSV mapping configs are also excluded because
        # they may use schema-specific syntax.
        exclude: '^(deploy/helm/.*/templates/.*\.ya?ml|.*\.github/.*reusable.*\.ya?ml)$'
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: schema-regen-check
        name: Check generated schema artifacts match YAML
        entry: uv run python scripts/regen_schema.py --check --quiet
        language: system
        pass_filenames: false
        files: ^schema/schema/jackpot_schema\.yaml$
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: docs-guard
        name: docs drift guard
        entry: uv run python scripts/check_docs.py
        language: system
        # Only the docs touched by this commit. CI (guardrails.yml) and `make`
        # still run the full scan with no filenames. Root-level markdown is in
        # scope as of 2026-08-28 — CLAUDE.md, README.md, todo.md and friends
        # were exempt from the guard built to catch exactly their drift.
        files: ^(docs/.*|[^/]+)\.md$
        pass_filenames: true
      - id: backlog-guard
        name: backlog consistency guard
        entry: uv run python scripts/check_backlog.py
        language: system
        files: ^active_backlog\.yaml$
        pass_filenames: false
      - id: alembic-single-head
        name: single alembic head
        entry: uv run python scripts/check_migration_heads.py
        language: system
        pass_filenames: false
      - id: status-regen
        name: STATUS.md is current
        entry: uv run python scripts/gen_status.py
        language: system
        pass_filenames: false
        # Only the two inputs that actually vary: test_count comes from a
        # pytest collect, alembic_head from the versions directory. Everything
        # else in STATUS.md is a constant or comes from the interpreter, so a
        # docs-only or source-only commit does not pay the ~3.4s collect.
        #
        # Regenerating rewrites docs/STATUS.md; pre-commit compares hashes and
        # fails the commit only when the content actually changed, so the
        # re-stage prompt appears exactly when the count moved — the same
        # shape as the ruff auto-fix hooks above.
        #
        # Why it exists: `make status` embeds a test count, so it is only
        # correct if run AFTER the last test is added. Running it mid-work and
        # then adding tests broke CI's guardrails job twice in one session.
        files: ^((tests|schema/tests|cli/tests)/.*|backend/db/migrations/versions/.*)\.py$
