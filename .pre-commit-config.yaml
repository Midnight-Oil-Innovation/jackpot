repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Disabled during local dev — re-enable before GCP deployment
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Pyright config + jackpot-course HTML use trailing whitespace
        # in <pre> blocks intentionally; don't strip those.
        exclude: '\.(html|htm)$'
      - id: end-of-file-fixer
        exclude: '\.(html|htm)$'
      - id: check-yaml
        # Helm templates use Go template syntax that isn't valid YAML
        # to a basic parser. Excluded from this hook; rely on
        # `helm lint` in the deploy workflow for Helm template
        # validation. CSV mapping configs are also excluded because
        # they may use schema-specific syntax.
        exclude: '^(deploy/helm/.*/templates/.*\.ya?ml|.*\.github/.*reusable.*\.ya?ml)$'
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: schema-regen-check
        name: Check generated schema artifacts match YAML
        entry: python3 scripts_jackpot/regen_schema.py --check --quiet
        language: system
        pass_filenames: false
        files: ^schema/schema/jackpot_schema\.yaml$
        stages: [pre-commit]
