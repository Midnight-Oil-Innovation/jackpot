[project]
name = "jackpot-backend"
version = "0.1.0"
description = "JACKPOT FastAPI backend — ingest, validation, pipelines, sample access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "JACKPOT Maintainers" }]
dependencies = [
    "alembic==1.13.1",
    "apscheduler>=3.11.2",
    "boto3==1.34.100",
    "epiweeks==2.1.4",
    "google-cloud-dlp>=3.18,<4",
    "google-cloud-secret-manager>=2.20,<3",
    "google-cloud-storage>=2.18,<3",
    "jackpot-schema",
    "fastapi==0.111.0",
    "fsspec>=2024.6,<2026",
    "httpx==0.27.0",
    "jinja2>=3.1.4,<4",
    "linkml==1.7.4",
    "linkml-runtime==1.7.2",
    "pandas==2.2.2",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings>=2.3.0,<3",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "pyyaml==6.0.1",
    "requests==2.32.2",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.30",
    "streamlit==1.35.0",
    "urllib3>=1.21.1,<2.4",
    "uvicorn[standard]==0.29.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.4.0",
    "factory-boy==3.3.0",
    "freezegun==1.5.0",
    "hypothesis==6.103.0",
    "moto[s3]==5.0.10",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-httpx>=0.30.0",
    "respx==0.21.1",
    "ruff==0.11.6",
    "testcontainers[postgres]==4.5.1",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv.sources]
jackpot-schema = { workspace = true }

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
exclude = [
    "backend/models_generated.py",
]
line-length    = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"setup/*.py" = ["E501"]
"db/migrations/versions/*.py" = ["E501", "E402"]
"scripts/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude                = ["db/migrations/", "scripts/", "tests/",]

# Useful checks without full strict mode
warn_unused_ignores    = true
warn_return_any        = false
disallow_untyped_defs  = false
check_untyped_defs     = true
