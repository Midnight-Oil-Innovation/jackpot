{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jackpot-api.serviceAccountName" . }}
  labels:
    {{- include "jackpot-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.serviceAccount.gcpServiceAccountEmail }}
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccountEmail | quote }}
    {{- end }}
{{- end }}
