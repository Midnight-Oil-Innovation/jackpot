apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jackpot-api.fullname" . }}-config
  labels:
    {{- include "jackpot-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.buckets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
