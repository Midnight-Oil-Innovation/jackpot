{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "jackpot-api.fullname" . }}-migrate-{{ .Values.image.tag | default "latest" | trunc 20 | replace "_" "-" }}
  labels:
    {{- include "jackpot-api.labels" . | nindent 4 }}
    component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "jackpot-api.selectorLabels" . | nindent 8 }}
        component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "jackpot-api.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /opt/venv/bin/alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: {{ include "jackpot-api.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.kubernetesSecretName }}
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
{{- end }}
