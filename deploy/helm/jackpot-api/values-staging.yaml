# Staging overrides — operator-agnostic template (Critical Rule 55).
#
# This file ships in git with placeholder values. Operator-specific
# fields (project ID, SA email, hostnames, CORS origins) are supplied
# at deploy time via `--set` flags in `.github/workflows/deploy-staging.yml`,
# which read them from environment-scoped GitHub Actions vars
# (GCP_PROJECT_ID, GCP_REGION, STAGING_JACKPOT_API_URL,
# STAGING_CORS_ORIGINS, etc.). See `docs/deploy/production-deploy.md`
# for the equivalent production wiring; the staging environment uses
# the same pattern.
#
# Operators who need to customise more than the workflow `--set`
# overrides can fork this file as `values-staging.local.yaml` (which
# is gitignored) and point their workflow at it instead. The committed
# `values-staging.yaml` MUST stay operator-agnostic.

image:
  # repository.tag are both injected by the deploy workflow at install
  # time. The full path is
  # `<region>-docker.pkg.dev/<project>/jackpot/jackpot-api`.
  repository: ""

replicaCount: 2

serviceAccount:
  # Synthesised at deploy time as
  # `jackpot-api@<project>.iam.gserviceaccount.com`. The application SA
  # name is fixed by the chart's serviceaccount template.
  gcpServiceAccountEmail: ""

env:
  ENV: "gcp"
  SCHEDULER_ENABLED: "false"
  STORAGE_BACKEND: "gcs"
  PIPELINE_EXECUTOR: "gcp_batch"
  DLP_ENABLED: "true"
  GCP_REGION: "us-central1"
  GOOGLE_OAUTH_REDIRECT_URL: "postmessage"
  # GCP_PROJECT_ID, JACKPOT_API_URL, CORS_ORIGINS are set per-operator
  # via the deploy workflow's --set flags. Leaving them as empty strings
  # here makes their absence at template time explicit; the deploy
  # workflow always overrides them.
  GCP_PROJECT_ID: ""
  JACKPOT_API_URL: ""
  CORS_ORIGINS: ""

buckets:
  # Bucket names follow the `jackpot-staging-*` convention. Any operator
  # can adopt these names verbatim, or fork the values file if they need
  # different naming (e.g. an org-prefix policy).
  STORAGE_BUCKET_SEQUENCES: jackpot-staging-sequences
  STORAGE_BUCKET_RAW: jackpot-staging-staging
  STORAGE_BUCKET_STAGING: jackpot-staging-staging
  STORAGE_BUCKET_DATASETS: jackpot-staging-references
  STORAGE_BUCKET_SUBMISSIONS: jackpot-staging-portal-exports
  WORK_BUCKET: jackpot-staging-work
  RESULTS_BUCKET: jackpot-staging-results

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi
