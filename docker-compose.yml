# JACKPOT local-dev / CI compose stack.
#
# Per design Decision 2 (docs/architecture/jackpot-init-cli.md): each
# service is gated by `profiles:` keys so the same compose file serves
# all 7 install scenarios. Activate profiles via the COMPOSE_PROFILES
# env var, which `jackpot init configure` writes to
# `instances/<name>/.env.local`.
#
# Service ↔ scenario matrix:
#
#     Service     │ A laptop  │ B/C/E single-org │ D multi-tenant │ T tribal │ F ci
#     ────────────┼───────────┼──────────────────┼────────────────┼──────────┼──────
#     postgres    │   ✓       │       ✓          │       ✓        │    ✓     │  ✓
#     api         │   ✓       │       ✓          │       ✓        │    ✓     │  ✓
#     ui          │   ✓       │       ✓          │       ✓        │    ✓     │  –
#     minio       │   ✓       │       –          │       –        │    –     │  ✓
#     minio_init  │   ✓       │       –          │       –        │    –     │  ✓
#
# Cloud scenarios (B/C/D/E/T) connect to managed Postgres + GCS, not
# the local containers — the postgres + api services here are the
# local-development counterparts. For real cloud deploys, use the
# Helm chart at deploy/helm/jackpot-api/ instead.
#
# Activation:
#   docker compose --env-file instances/local/.env.local up
# or:
#   COMPOSE_PROFILES=laptop docker compose up
# or (legacy, pre-jackpot-init):
#   docker compose --profile laptop up

services:

  postgres:
    image: postgres:16
    platform: linux/arm64
    container_name: jackpot_postgres
    profiles: ["laptop", "single-org", "multi-tenant", "tribal", "ci"]
    environment:
      POSTGRES_USER:     jackpot
      POSTGRES_PASSWORD: jackpot
      POSTGRES_DB:       jackpot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackpot"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    platform: linux/arm64
    container_name: jackpot_minio
    profiles: ["laptop", "ci"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio_init:
    image: quay.io/minio/mc:latest
    platform: linux/arm64
    container_name: jackpot_minio_init
    profiles: ["laptop", "ci"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/jackpot-raw;
      mc mb --ignore-existing local/jackpot-sequences;
      mc mb --ignore-existing local/jackpot-staging;
      mc mb --ignore-existing local/jackpot-results;
      mc mb --ignore-existing local/jackpot-datasets;
      mc mb --ignore-existing local/jackpot-pipelines;
      mc mb --ignore-existing local/jackpot-submissions;
      echo 'All buckets ready.';
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jackpot_api
    profiles: ["laptop", "single-org", "multi-tenant", "tribal", "ci"]
    environment:
      ENV:                        local
      DATABASE_URL:               postgresql://jackpot:jackpot@postgres:5432/jackpot_db
      STORAGE_ENDPOINT:           http://minio:9000
      STORAGE_ACCESS_KEY:         minioadmin
      STORAGE_SECRET_KEY:         minioadmin
      STORAGE_BUCKET_SEQUENCES:   jackpot-sequences
      STORAGE_BUCKET_RAW:         jackpot-raw
      STORAGE_BUCKET_STAGING:     jackpot-staging
      STORAGE_BUCKET_DATASETS:    jackpot-datasets
      STORAGE_BUCKET_SUBMISSIONS: jackpot-submissions
      SECRET_KEY:                 dev-secret-key-change-in-prod
      MOCK_USER_EMAIL:            admin@example.org
      GOOGLE_OAUTH_CLIENT_ID:     ""
      GOOGLE_OAUTH_CLIENT_SECRET: ""
      GOOGLE_OAUTH_REDIRECT_URL:  postmessage
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Both api and ui resolve schema files at /app/schema. The api
      # service gets it for free via the workspace bind mount above
      # (./ → /app puts ./schema at /app/schema); ui mounts ./schema
      # to /app/schema directly because it does not bind the whole
      # workspace.
      #
      # Mount the host docker socket so testcontainers-based tests
      # running inside the api container can spawn sibling Postgres
      # containers via the host docker daemon. Without this, every
      # in-container test that uses the `db_conn` fixture fails with
      # docker.errors.DockerException. Only meaningful in scenarios
      # that include the `laptop` or `ci` profiles.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        # `required: false` so cloud profiles (which don't activate
        # minio) still resolve. Local profiles activate minio and the
        # health gate fires normally.
        condition: service_healthy
        required: false

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: jackpot_ui
    # No CI profile: the integration tests don't need Streamlit; the
    # ui service is opt-in for any scenario where humans look at it.
    profiles: ["laptop", "single-org", "multi-tenant", "tribal"]
    environment:
      API_BASE_URL:    http://api:8000
      ENV:             local
      MOCK_USER_EMAIL: admin@example.org
      PYTHONPATH:      /app
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
      - ./schema:/app/schema
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
