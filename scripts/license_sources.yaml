# scripts/license_sources.yaml — upstream LICENSE URLs for verify_licenses_assistant.py
#
# Rules:
# 1. url MUST point at the raw LICENSE file (or COPYING), not the landing page.
#    For github: https://raw.githubusercontent.com/OWNER/REPO/BRANCH/LICENSE
#    For huggingface: model card LICENSE field, or the raw file if hosted.
# 2. Pin the branch/tag if you care about the version you verified against.
#    Using main/master means "whatever is HEAD today"; a tag means "this release".
# 3. Never trust a README claim. Only trust the LICENSE file's own text.
# 4. Some tools have their real license in COPYING, not LICENSE. Try both.
#
# Curated URLs are best-effort seeds; if a fetch 404s or returns a landing page,
# open the repo in a browser and update the url here.

# --- Group 1: verify now (feeds actively-scoped work) ---

