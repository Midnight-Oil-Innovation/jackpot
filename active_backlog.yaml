      verb and the PEER_INSTANCE grant; this policy lands with it, when there
      is a call site to test it against.
      Shape when it lands: DENY on federation:push where deletion_status is
      not ACTIVE, conditioned on request_origin == FEDERATION. Note the
      guards.py DENY invariant M3 established — the policy may only read
      attributes SAMPLE_ATTRIBUTE_COLUMNS loads, and may only key on a
      capability whose routes resolve a Sample resource.
