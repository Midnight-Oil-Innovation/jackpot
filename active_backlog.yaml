    notes: |
      Raised 2026-09-02 out of M2-DROP-PRE slice 7 (PR #198), which removed
      is_platform_admin / is_data_analyst from PATCH /users/{id} in favour of
      instance_preset. Correct under §10 and it broke no in-tree caller — the
      grep across frontend/, cli/ and deploy/ finds only /users/me — but it
      is the first change in this repo that would have broken somebody, had
      there been a somebody.

      The interim control is a grep, documented in CLAUDE.md's branching
      section: `git log --oneline --grep="[Bb]reaking" main..development`
      before a release PR, every hit named in the PR body. Deliberately
      derived from commit history rather than a CHANGELOG.md — one entry does
      not earn a file, and a second home for a fact nothing regenerates is
      the failure mode PR #195 was about.

      What this item has to decide when it comes up, none of which is worth
      deciding early: whether /api/v1 gets a sibling version or breaks in
      place (Critical Rule 6 fixes the prefix but says nothing about
      versioning policy); whether a deprecation window exists at all given
      §10's no-shim stance, which is a statement about the authorization
      model rather than about every API; and where operators are told —
      release notes, jackpot init output, or a doctor check. Do not
      pre-build a changelog for it.

  - id: B-LICENSE-DATA-TERMS
    title: Data-use terms for queried data sources (separate from code licensing)
    short_description: |
      Decide whether data sources need their own compliance check covering
      redistribution rights, attribution, and publication of derived results
      — questions AGPL-3.0 copyleft does not answer.
    phase: p0_series
    status: tracked_not_scheduled
    depends_on: []
    blocked_by_external:
    parallel_safe: true
    effort_sessions: 1
    primary_files:
      - docs/THIRD_PARTY_LICENSES.md
      - scripts/verify_licenses.py
    test_files:
      - tests/test_verify_licenses.py
    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Split out 2026-08-28 when "Databases and references" was exempted from
      the code gate. Exempting it was correct -- AGPL copyleft governs
      distributed code, not queried data -- but it moves data sources from
      wrongly-gated to ungated, and data-use terms are a real and different
      compliance question.

      Deliberately NOT pre-built. The section holds exactly one row (SRA, US
      public domain, queried and never redistributed), so there is nothing to
      check yet and no second example to design a vocabulary against. YAGNI.

      The trigger to pick this up is a restricted source landing in that
      table. GISAID is the obvious candidate for this domain: its data-use
      terms are restrictive, JACKPOT ships a gisaid.py router, and ADR-0001
      records an anti-GISAID-capture position. At that point the questions
      worth automating are redistribution rights, attribution requirements,
      and whether derived results may be published -- none of which the
      current allowlist/denylist vocabulary can express, since it is built
      for SPDX code identifiers.

      Note the guard already refuses to conflate the two: a test pins that
      widening the public-domain pattern must not sweep "public data" in.

  - id: B-LICENSE-DNABERTS-ADOPTION
    title: Resolve DNABERT-S code licensing before adoption
    short_description: |
      github.com/MAGICS-LAB/DNABERT_S carries no LICENSE file. The weights are
      declared Apache-2.0 on the HF model card; the code has no stated grant.
      Resolve with upstream before wiring the edge tier.
    phase: p0_series
    status: tracked_not_scheduled
    depends_on: []
    blocked_by_external: "DNABERT-S adoption (edge-tier detection work)"
    parallel_safe: true
    effort_sessions: 0.5
    primary_files:
      - docs/THIRD_PARTY_LICENSES.md
      - scripts/license_sources.yaml
    test_files: []
    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Supersedes B-LICENSE-CCBY-ADOPTION, which was filed 2026-08-28 on the
      belief that DNABERT-S was CC BY 4.0. Verification the same day found no
      CC-BY anywhere: the HF model card declares license apache-2.0 for the
      weights, and the GitHub code repo has no LICENSE file at all (GitHub
      detects none). The CC-BY claim most likely came from the paper's licence
      rather than the software's. Recorded here because the mistake is the
      alibi-detect pattern and worth not repeating.

      What actually needs resolving: DNABERT-S derives from DNABERT-2, whose
      LICENSE verifies as Apache-2.0 -- but Apache-2.0 is permissive, so a
      derivative's own new code is not automatically covered by the parent's
      grant. Portions copied from DNABERT-2 remain Apache-2.0 (and Apache-2.0
      section 4 obliges a distributor to ship the licence and NOTICE, which
      DNABERT_S does not appear to do); DNABERT-S's own additions have no
      stated grant, which defaults to all rights reserved.

      Options at adoption: ask upstream to add a LICENSE file (cheapest and
      benefits everyone); or use only the weights, relying on the model card's
      apache-2.0 declaration and avoiding the unlicensed code; or drop
      DNABERT-S for a tier-appropriate alternative -- METAGENE-1 is already the
      license-cleared choice, and NT v2 / Evo 2 remain unverified candidates.

      Apache-2.0 is on the allowlist, so nothing is blocked today: the row is
      [candidate] and nothing imports it.

