  - id: B-CARE-3
    title: Sovereignty deletion — implementation (sub-items 3a..3g)
    short_description: |
      Implement sovereignty-deletion design per §13 of sovereignty design
      doc. Seven sub-items covering tombstone, propagation, audit, RTBF.
    phase: phase_24_5
    status: shipped
    depends_on: []
    blocked_by_external:
    parallel_safe: false
    effort_sessions:
    primary_files: []
    test_files: []
    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Aggregate entry covering B-CARE-3a..3g, plus two items folded in
      2026-08-28.

      (1) RENAME. Per ADR-0013 the is_deleted -> is_archived rename
      (B-CARE-3i) MUST ship inside this same change: renaming first would
      silently remove deletion from the API, implementing first would leave
      both representations writable at once. 43 is_deleted reference sites in
      backend/ plus a migration.

      (2) ENFORCEMENT. The VACUUMED-means-content-gone invariant is enforced
      here, not ahead of here. It was scoped as a standalone CHECK constraint
      and dropped on inspection: samples.fastq_r1_uri is TEXT NOT NULL in
      baseline 5adf11b77c19 and never altered, so a constraint requiring
      content columns to be NULL when VACUUMED is unsatisfiable; and per
      Critical Rule 58 sample content lives in sample_files ->
      file_references, which a single-table CHECK on samples cannot see. This
      implementation decides where content is at vacuum time and whether
      fastq_r1_uri becomes nullable, so the constraint and its cross-table
      test are written against that decision. Enforcement must be mechanical,
      not review-based.

      NOT NEEDED (closed 2026-08-28 without implementation): audit_log
      deletion event names. Tracked briefly as B-CARE-3h on the belief that
      P0b had dropped them. It had not: migration c871b28bbdab documents them
      as a deliberate no-op close-out because audit_log.action is free TEXT --
      there is no audit_log.event_type column and no enum to extend -- and
      assigns the strings to B-CARE-3f in P0c. Note that the seven existing
      deletion-adjacent AuditActions constants (REQUEST_DELETION,
      COMPLETE_DELETION, SOFT_DELETE_SAMPLE, ...) currently have zero call
      sites; B-CARE-3f should reconcile them rather than add a parallel set.

      NOT NEEDED (closed 2026-08-28 without implementation): a migration to
      stop deletion_status asserting ACTIVE over archived rows. Under ADR-0013
      an archived sample has not been deletion-requested, so ACTIVE is the
      correct value. samples.is_deleted is written by exactly one call site
      (routers/samples.py, the archive endpoint), and no row has ever been
      deletion-requested because no code path can do it. The column is
      vacuously correct, not wrong.

    merged_at: '2026-08-29'
    merge_sha: 93f39fd
