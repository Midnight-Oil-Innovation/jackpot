  - id: M2-DROP-PRE
    title: Convert every legacy-column reader (reversible half of M2-DROP)
    short_description: |
      Everything M2-DROP needs that is NOT the irreversible ALTER TABLE, so
      the drop itself becomes small and boring. Split at the maintainer's
      direction after the inventory came back larger than M2-DROP assumed:
      12 production sites, 41 test files carrying 138 references, and 7 sites
      needing §4 catalog verbs that do not exist.
      Slice 1 SHIPPED: deletion:self_approve. §6.2-1b's escape was a
      request-body flag the route passed straight into the policy condition,
      so any principal could lift the separation-of-duties DENY. Not
      exploitable end to end — deletion.py re-checked is_platform_admin — but
      that check was itself on the removal list, so the drop would have opened
      the hole. Now a capability held only by instance_administrator, with the
      route ANDing what was asked against what is held, and deletion.py's
      legacy check removed (reader 2 of 12 retired).
      Slice 2 SHIPPED: the five samples.py sites and their verbs. The design
      question the split was made for — a read verb whose natural form excludes
      instance admins while the legacy flag admitted them — resolved on one
      discriminator: an instance admin KEEPS a route that reads or executes a
      governance RECORD and LOSES one that returns sample CONTENT or makes a
      consent decision. So deletion:read_report, deletion:reverse_tombstone and
      deletion:vacuum go to the admin; sample:read_unscrubbed and
      submission:retract do not. samples.py now reads neither legacy column
      (readers 3-7 of 12 retired). The existing suite could not have caught
      either narrowing: the baseline seeds admin@example.org as platform admin
      AND Lab Director of lab 1, so every "as admin" test holds both preset
      grant sets and all of them stayed green — see
      tests/test_deletion_plane_capabilities.py, which builds single-shape
      principals for that reason.
      Slice 3 SHIPPED: tenancy.py DELETED rather than converted. The planned
      conversion (require_org_access's admin bypass falling out of ADR 0015
      containment) was right about the mechanism and wrong about the premise:
      require_org_access had no production callers, get_org_context had none,
      and nothing read the request.state.org_context the middleware set — at
      one get_current_user DB lookup per request. Org isolation is structural
      (grants rooted at instance://self/org/N, _scope_contains matching at a
      segment boundary), and byop.py, the "mandatory IDOR case", had already
      converted to permits() under M2-B3 without ever calling the wall. Rule 70:
      building the half with no call site reads as done and no test can exercise
      it. access_model.md §5.4 claimed the wall was "a DENY policy keyed on
      cross-org access; no grant punches through it" — no such policy exists,
      and an Instance-scoped grant punches through by design; §2/§3.2 carried
      the same claim twice more. All three corrected (readers 8-10 of 31
      retired at zero conversion cost).
      Slice 4 SHIPPED: federation/deletion_propagation.py's admin-notification
      lookup. New authz/principal.py::capability_holders() is the reverse of
      load_principal — "who holds this" rather than "what does this principal
      hold" — with _scope_contains transcribed to SQL so containment runs the
      same direction (grant contains resource, never the reverse). Excludes
      expired grants, inactive users, peer principals (the users join), and
      CONDITIONAL grants: a condition is a request fact and a scheduled job has
      no request, so the engine's refuse-what-you-cannot-evaluate rule applies.
      Documented NOT a decision function — it sees grants only and is blind to
      DENY policies, so authorizing off it would rebuild the second decision
      point §2.1 forbids. The alert now selects federation:configure_peer at
      instance scope, i.e. the people who can act on the peer (suspension
      writes federated_instances.federation_enabled, a configure-peer act)
      rather than admins as a class; logs a warning when that set is empty,
      since the audit row survives but the push is silently lost otherwise.
      The old test asserted on u.is_platform_admin and would have stayed green
      after the reader vanished; replaced, plus a narrowing pair (grant without
      flag IS alerted, flag without grant is NOT) that the seeded
      both-at-once admin could never have caught.
      Slice 8 SHIPPED — M2-DROP-PRE IS COMPLETE. dev-login was the last
      role-ASSIGNMENT site. Its `role` param keeps the six APGAP names: those
      are Critical Rule 1's sacred values, they name permission_groups rows,
      and they are the vocabulary the E-1 UAT matrix drives — none of that
      ends at M2-DROP. What ends is the boolean pair they were stored as. New
      INSTANCE_ROLE_PRESETS bridges the two live vocabularies (the twin of
      MEMBERSHIP_PRESETS for the roles that are not lab-scoped) and OUTLIVES
      the drop, unlike INSTANCE_PRESET_FLAGS. _DEV_LOGIN_GLOBAL_ROLES is
      derived from it so a role can never be accepted without a preset to
      issue. The response reports instance_preset beside membership — the two
      halves of what a session may do, at the two scopes that can carry it —
      and `user` is identity only. Removing the response booleans made the
      SELECT/RETURNING columns and the dict mutation dead, so those went too
      (slice 5's shape, one file later). tests/e2e/scripts/
      register_user_lab_project.py follows.

      NO PRODUCTION READER OF EITHER COLUMN REMAINS. What is left in
      backend/backend is writes and one SELECT feeding a write: auth.py and
      users.py write the columns so reseed() stays consistent, and reseed.py
      reads them because translating them is its job. That is precisely
      M2-DROP's inventory and nothing else.

      Verified by red-green at every slice, not by reading: slice 8 stubs out
      sync_instance_preset and four tests go red, including one asserting the
      response cannot name a role the principal does not hold.

      HANDOFF TO M2-DROP, corrected against the tree at 2026-09-02:
