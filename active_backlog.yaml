  - id: M2-SAMPLE-ACCESS-SYNC
    title: Approving a sample-access request must issue a capability grant
    short_description: |
      POST /sample-access/requests/{id}/approve inserts a sample_access_grants
      row but issues nothing into authz_capability_grants. Since M2-B2 the
      detail route decides via require_capability("sample:read_detail",
      sample_id=...), and neither authz/policy.py nor authz/visibility.py has
      an approved-request rung — the ONLY translation from
      sample_access_grants to a capability grant is reseed._sample_access_rows,
      which runs at migration time.
      So an approved requester gains nothing until someone runs a reseed. This
      is the same class of bug M2-B5 fixed on the membership side with
      sync_membership_grants(); sample access has no twin. Fails CLOSED
      (denies access that should be allowed), so it is a functionality gap
      rather than a security hole — which is also why no test caught it: the
      existing tests called the legacy can_access_sample() helper, which read
      the table directly.
      Fix: a sync_sample_access_grants(conn, *, requester_id, sample_id) beside
      sync_membership_grants, called on approve and on revoke, honouring
      access_expires_at as not_after. Then point tests/test_sample_access_
      router_api.py's _can_read_detail helper at the route instead of running a
      full reseed.
    phase: access_model_redesign
    status: shipped
    depends_on:
      - M2
