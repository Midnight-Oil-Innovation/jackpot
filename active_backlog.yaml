  # ── B2 prerequisites — found when B2 started (2026-08-31) ───────────────
  # The carve assumed the sample plane was structural like the others. It is
  # not: 12 of its 27 rows are Sample-scoped, and its read routes decide on
  # resource ATTRIBUTES (sharing_level, surveillance_relevant) that the engine
  # cannot currently see. Each item below is small; together they are what
  # makes a faithful B2 possible instead of one that quietly removes access.
  - id: M2-B2-PRE-A
    title: Resource carries attributes — attribute-policies become expressible
    short_description: |
      access_model.md §2.4 gives a Resource `attributes` alongside its scope,
      and §2.5 builds the whole attribute-policy half of the model on reading
      them. M0 shipped `Resource` with `scope` only, and `policy._matches`
      compares capability + scope + grant conditions against the request
      context — never resource attributes. So the three permissive rungs of
      the legacy ladder cannot be written as policies at all:
        PUBLIC sharing_level readable by anyone (§5 names this as THE example
        of an ALLOW policy), DISCOVERABLE list-visible, and
        surveillance_relevant readable by a sample:read_surveillance holder.
      Add `attributes: dict` to Resource, extend `_matches` to evaluate a
      policy's resource predicate, and mirror it in visibility_sql_clause so
      the row-wise and SQL paths stay equivalent (the M1 property).
      Ship the three rungs as a static policy set — they are fixed today, not
      operator-configurable — and leave DB-backed loading to M3. Without this
      B2's read routes would deny PUBLIC samples to non-members: a silent
      access REMOVAL, closed rather than open, but a functional break.
    phase: access_model_redesign
    status: shipped
    depends_on:
      - M2-B1
    blocked_by_external:
    parallel_safe: false
    parallel_safe_reason: "Authorization decision path, serialized (CLAUDE.md, Authorization-path serialization)."
    effort_sessions: 1.5
    primary_files:
      - backend/backend/authz/engine.py
      - backend/backend/authz/policy.py
      - backend/backend/authz/visibility.py
    test_files:
      - tests/authz/test_permit.py
      - tests/authz/test_visibility_sql_clause.py
    source_of_truth_views:
      - docs/access_model.md
    pr_title_template: "feat(authz): M2-B2-PRE-A — resource attributes and attribute-policies"
    branch_name_template: m2-b2-pre-a-resource-attributes
    role_framing:
    notes: "Shipped #158 (merge f1dcfe2). Predicates kept declarative (equality, in, PRINCIPAL_ID) so both the Python and
      SQL halves can evaluate them — a lambda would have been unimplementable in SQL. requires_capability added for the principal
      half of the surveillance rung. Ownership shipped as a POLICY, deviating from §5's mapping table which calls it a Sample-scope
      grant: as a grant it would need a row written per sample creation and deleted per transfer. Unmapped attribute RAISES
      — a dropped term widens an ALLOW and neuters a DENY."
    merged_at: '2026-08-31'
    merge_sha: f1dcfe2 cross-checked on the same fixtures as M1."

