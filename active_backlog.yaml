  - id: M2-B6
    title: SERVICE-principal callbacks (2 routes)
    short_description: |
      pipelines/events and pipelines/{run_id}/results/{result_type}. Last,
      because PrincipalKind.SERVICE has no route precedent — every other
      guarded route resolves a HUMAN principal from a user JWT.
      The per-run X-Pipeline-Token stays as AUTHENTICATION (hmac.compare_digest,
      401, already tested both ways). What this batch adds is AUTHORIZATION: a
      SERVICE principal holding pipeline:write_results at the run's project
      scope. Today the token collapses the two, since holding it IS the
      permission. Separating them is what makes the cryptWWDB
      compute-without-read property structural (§4.6, §9.4) instead of a
      consequence of how tokens are minted — a data_source_lab principal holds
      pipeline:write_results and not sample:read_detail, and permit() is where
      that becomes enforceable.
