# ────────────────────────────────────────────────────────────────────────
  # Access-Model Redesign (M0–M5) — greenfield capability-first authz.
  # Design of record: docs/access_model.md (§1–§11). Replaces the APGAP
  # ladder in backend/backend/permissions.py with permit() + grants/policies.
  # Dependency graph (access_model.md §11.2):
  #   M0 → M1 → M2 → {M3, M4, M5}; ACCESS-GUARD-MAP + ACCESS-SEED block M2.
  # ────────────────────────────────────────────────────────────────────────

  - id: M0
    title: permit() engine + grants/policy tables, dark (wired into no route)
    short_description: |
      Build the capability-first decision engine from access_model.md §5 as
      NEW code, called by nothing — the old permissions.py ladder still runs.
      FIRST TASK of this session is a scoping decision: choose the authz
      module location (recommend backend/backend/authz/) and record it in a
      one-line note in docs/access_model.md or the session summary; then build
      permit() + the grants and policy tables THERE. Deliverables:
        - permit(principal, capability, resource, context) -> ALLOW|DENY with
          strict deny-wins and default-deny (§5.1, §5.2 sketch).
        - Grants table (capability + scope_ref + conditions + source) and
          policy set (§2.2, §2.5) as hand-written migrations — NO ORM, raw
          SQL via text(), target_metadata=None convention (§5.2).
        - Unit tests turning the §9 worked examples into fixtures: 9.1 laptop,
          9.2 SaaS tenant isolation + surveillance read, 9.4 cryptWWDB
          compute-without-read. These must pass against permit() in isolation.
      Ships behind no flag because nothing calls it yet — that is the point;
      it de-risks everything downstream by proving the decision function
      correct before anything depends on it. Run as MANUAL flow (Workflow 1),
      not jackpot-batch: this is a new session shape and the scaffolding
      decisions want turn-by-turn eyes.
    phase: access_model_redesign
    status: open
    depends_on: []
    blocked_by_external:
    parallel_safe: false
    parallel_safe_reason: "Foundational new package + migrations; scaffolding decisions need interactive review. Manual flow
      per coding_scripts_howto 'first time running a new session shape'."
    effort_sessions: 3
    primary_files:
      - backend/backend/authz/
    test_files:
      - tests/authz/test_permit.py
    source_of_truth_views:
      - docs/access_model.md
    pr_title_template:
    pr_title_function:
    branch_name_template: m0-permit-engine
    role_framing:
    notes: "authz module path is an M0 scoping decision (recommend backend/backend/authz/); primary_files lists the recommended
      dir and tightens once chosen. access_model.md §5 + §9 fixtures."

  - id: M1
    title: visibility_sql_clause companion — list-filtering, cross-checked vs permit()
    short_description: |
      Build the SQL list-filtering compiler (access_model.md §5.2) that
      produces a WHERE fragment matching what permit() allows per-row, so the
      samples list endpoint filters at the DB tier instead of calling permit()
      per row. The existing permissions.py.visibility_sql_clause is the model
      to evolve. CRITICAL property: a row is list-visible iff permit() says it
      is detail-accessible — prove this with cross-checking tests on the SAME
      §9 fixtures M0 used. Highest-risk piece (two implementations of one
      logic that must not diverge), which is why it is its own phase. Still
      dark — no route uses it yet. No ORM; raw SQL via text().
    phase: access_model_redesign
    status: blocked
