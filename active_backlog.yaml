           routes that need it would make them reachable by nobody — the exact
           failure reseed.py's own comments record having happened twice.
           (The B3 note saying M2 must "land the catalog entry" was stale:
           §4 already has the verb. What was missing is a holder.)
        2. The map decides launch and the run routes at PROJECT scope, but
           principal.py resolves lab and sample only. Same shape as PRE-B,
           one level down.
        3. CONTRADICTION, resolved: the map gave run-status reads
           `pipeline:run` while §4 defines `pipeline:read` as "the pipeline
           zoo, the BYOP registry, and run status". §4 wins — watching a run
           is not launching one, and `pipeline:run` sits only in lab_lead +
           Bioinformatics User, so the map's reading would have removed run
           visibility from every Lab Collaborator and Lab Reader for runs on
           their own lab's samples.
        4. CONTRADICTION, resolved: the map gave BYOP catalog reads
           `pipeline:read` at Lab while byop.py says reads are "INTENTIONALLY
           unscoped per design §9 (catalog browse)". The router wins — a
           pipeline definition is not tenant data, and this is the same shape
           as the sequencing-lab registry the map already calls AUTH-ONLY BY
           DESIGN. BYOP mutations stay tenancy-guarded.
