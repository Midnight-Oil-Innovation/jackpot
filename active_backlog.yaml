  # order pinned in M2, not by file. Every batch is landable while the legacy
  # columns still exist, so only the final drop is irreversible.
  - id: M2-B1
    title: require_capability calls permit() — flips all 28 wired routes at once
    short_description: |
      The highest-leverage single change in the cutover, and the one with the
      most evidence behind it. auth/guards.py's require_capability currently
      runs the legacy ladder inline (platform-admin bypass, then lab
      membership, then the project->lab join, then the director flag).
      Rewrite its body to load the principal's grants and call permit(); the
      28 routes that already pass through it flip together, with no per-route
      edits.
      Acceptance evidence already exists: the preflight matrix compares
      legacy_guard against new_guard over 12 personas x 13 capabilities x 3
      scopes and asserts zero unexpected divergences against the registered
      classes. After this batch that comparison stops being a simulation —
      new_guard IS the guard — so the matrix must be re-pointed at the real
      require_capability rather than its stand-in, and any divergence that
      moves is a behavior change to explain, not a fixture to adjust.
      Principal loading is the new work: one query joining
      authz_capability_grants for the user, cached per request. Do NOT
      re-derive membership inline (Critical Rule 24).
