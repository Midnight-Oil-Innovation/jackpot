    role_framing:
    notes: "Token check untouched — authorization added beside it, and ordered after it so a bad token answers 401 (who are
      you) rather than 403 (you may not), which would confirm the run exists and is writable to an unauthenticated caller.
      The positive check CANNOT FAIL today and the code says so rather than pretending otherwise: the principal is built from
      the same run the token authenticated against. The value is the chokepoint — at M4/M5 a data_source_lab peer with the
      §8.4 preset reaches the same route and the answer differs without the route changing. The load-bearing half now is the
      NEGATIVE one: the principal holds pipeline:write_results and nothing else, so permit() refuses it sample:read and sample:read_detail
      on the samples its own run computes over, and refuses the enclosing lab and the instance root. pipeline_run_principal
      RAISES on a run row with no project_id rather than rooting at the instance — the results route was not selecting that
      column, and a fallback there would have handed a pipeline callback authority over the whole deployment."
