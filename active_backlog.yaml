  - id: B-DRS-URI-1
    title: DRS-style URI conventions - decide, then either resolve or reject
    short_description: |
      validator.py accepts drs:// alongside gs:// and s3://. Nothing
      resolves it: backend/storage/ has gcs, s3 and local backends and no
      DRS client. A file registered with a drs:// URI passes validation
      and is unreadable by every downstream path.
    phase: p0_series
    status: shipped
    merged_at: "2026-09-03"
    merge_sha: "46936df"
    depends_on: []
    blocked_by_external:
    parallel_safe: true
    parallel_safe_reason: "Storage backend plus one validator branch. Touches no authorization path."
    effort_sessions: 1
    primary_files:
      - backend/backend/validator.py
      - backend/backend/storage/factory.py
      - backend/backend/storage/base.py
    test_files:
      - tests/test_storage_drs.py
    source_of_truth_views:
      - docs/architecture.md
    pr_title_template:
    branch_name_template: "feat/drs-uri-resolution"
    role_framing:
    notes: >
      architecture.md 21.1 rates this "Already 80% there; formalize as
      standard". Grep says otherwise: the whole of DRS in this repo is one
      string prefix in one validator branch (validator.py:387). Accepting
      a scheme nothing can dereference is the weaker of the two options -
      the decision is resolve or reject, and rejecting is one line if no
      operator wants DRS ingest.

      A DRS client is a real dependency decision (license plus deptrust per
      the dependency policy) and DRS servers return signed URLs with their
      own auth, so this is not the afternoon the doc implies. Size it after
      deciding. The 18.2 FAIR row now states the real position rather than
      claiming the scheme as met.

      DECIDED 2026-09-03: rejected, not resolved. drs:// is removed from the
      recognised scheme list; RESOLVABLE_URI_SCHEMES in validator.py is now
      ("gs://", "s3://") and is documented as tracking
      backend/storage/factory.py. Recognising a scheme nothing can
      dereference told a submitter their URI was fine when no pipeline could
      ever open it. Resolving it would have meant a DRS client (a dependency
      decision under the license + deptrust policy) plus signed-URL auth
      handling, and no operator had asked for it. Add it back alongside a
      real backend, never ahead of one.

      Note the check has always been advisory - _check_uri_schemes appends
      to warnings, never errors - so this narrows what JACKPOT CLAIMS to
      support rather than adding a gate. A test pins that, so a later change
      cannot quietly promote scheme recognition to a hard failure.

      Scope was larger than the one-line prediction, because the claim had
      four other homes: two LinkML descriptions (forcing a gen-pydantic
      regeneration plus the Rule 20 boolean patch, and a gen-json-schema
      run), the 21.1 and 18.2 rows in architecture.md, the DRS row and
      current-state paragraph in governance_alignment.md, and the adoption
      row in platform_landscape.md. governance_alignment.md 338 was the
      worst of them: it asserted the scheme "is recognized by the resolver"
      and that "pipeline executors can resolve drs:// URIs to actual paths
      at compute-node time". No resolver has ever existed. Critical Rule 70
      again, and the reason the one-line estimate was wrong.

