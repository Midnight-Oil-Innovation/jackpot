  - id: M4-B
    title: Federation Layer 2 — wire agreement grants into the decision path
    short_description: |
      The half of M4 that changes behavior. M4-A landed the schema, the
      projection into authz_capability_grants, and load_peer_principal, all
      dark. This turns them on:
        (a) L1 query — the federated samples path filters by what the PEER
            principal can see, via the same visibility_sql_clause companion
            local lists use (§7.4). Today that path is PUBLIC/DISCOVERABLE-only
            and consults no agreement, so this is the change that makes
            per-peer differential access real — and the one where an
            over-grant leaks across an instance boundary.
        (b) L2 push — FederationPushJob.is_qualifying_sample consults permit()
            for federation:push at the sample's scope, with the three
            qualification gates as grant conditions (§7.4). is_qualifying_sample
            is a pure function today and push_to_hub's IO is still stubbed, so
            the decision half can land and be tested without the IO half.
      (b) is what gives M3-FEDERATION-DELETION-GUARD a call site.
      Pin AM-OPEN-2 (org floor vs peer floor vs stricter-of-two) when L2 push
      IO is wired, per §7.6-1 — not required for the decision wiring itself.
