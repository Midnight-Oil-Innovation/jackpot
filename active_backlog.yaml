  - id: M4
    title: Federation Layer 2 — sharing_agreements table + agreement-sourced grants
    short_description: |
      Add the sharing_agreements table (access_model.md §7.3, §7.6 Q3 — net-new
      schema, hand-written migration, no ORM) and wire agreement-sourced grants
      into the M0 engine. Federated L1 visibility stops being
      PUBLIC/DISCOVERABLE-only and starts honoring per-peer agreements;
      lab-to-lab federation (§7.7) works on the data-holder's side at this
      point. Shipped FED-A/B flow code is unchanged — what changes is that the
      peer principal now has agreement grants for permit()/visibility_sql_clause
      to find. Pin AM-OPEN-2 (the min_sharing_level floor composition) when L2
      push IO is wired. Sequences with or just after P0c.
    phase: access_model_redesign
    status: shipped
    depends_on:
      - M2
    blocked_by_external:
    parallel_safe: false
    parallel_safe_reason: "New migration + engine grant-source wiring; federation-adjacent."
    effort_sessions: 3
    primary_files:
      - backend/backend/authz/
      - backend/backend/federation/
    test_files:
      - tests/authz/test_sharing_agreements.py
    source_of_truth_views:
      - docs/access_model.md
    pr_title_template:
    pr_title_function:
    branch_name_template: m4-sharing-agreements
    role_framing:
    notes: "Shipped M4-A only, the dark half. sharing_agreements + sharing_agreement_grants (migration f9c3e60b7d18, hand-written,
      no ORM), sync_agreement_grants() projecting them into authz_capability_grants with source='agreement', and load_peer_principal().
      Nothing on a request path calls any of it — same staging M0 used for the engine and M2's additive migration used for
      the reseed, so the behavior-changing step lands alone. Two tables rather than a JSONB grants blob: the grants have the
      same shape as every other grant in the system, so the sync is a projection rather than a JSON parse whose schema drifts.
      Reconciles per PEER, not per agreement — a peer may hold several and 'what does this peer hold' is the question the
