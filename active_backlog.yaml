# Resolved 2026-08-28: this file previously carried BOTH a "Superseded — do not
# hand-edit" header AND a "source of truth" line, while being the thing people
# actually edited (see 8cea892). todo.md has been reframed as the historical
# ledger; this file is canonical for what to work on next.
#
# Validated by scripts/check_backlog.py — schema, dependency graph, and stale
# statuses. It runs in pre-commit (on changes to this file), in CI via
# .github/workflows/guardrails.yml, and from `make guardrails`. It is the
# jackpot_backlog_check.py this header used to promise.
#
# Still aspirational — THESE SCRIPTS DO NOT EXIST as of 2026-08-28:
#   - jackpot_next.py          — print unblocked/blocked candidates
#   - jackpot_gen_prompt.py    — emit session prompt skeletons
#   - jackpot_finish_helper.py — auto-flip status to shipped post-merge
#
# Note: docs/pipeline_knowledge.yaml keys off the `phase` values used here,
# so renaming a phase requires updating that file too.
#
# Maintenance: hand-edited. Keep ordering by phase for readability.
#
# Status values:
#   shipped               PR merged on development, no further work this round
#   open                  Ready to work on (deps met or empty)
#   blocked               Blocked on an internal dep also in this file
#   blocked_external      Blocked on a phase / coalition outside this file
#   tracked_not_scheduled Backlog item, not yet prioritized
#
# Optional fields populated when status: shipped:
#   merged_at: "YYYY-MM-DD"
#   merge_sha: "abc1234"
#
# Last updated: 2026-05-12

