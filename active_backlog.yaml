    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Anchor, 2026-09-03: `jackpot-batch prepare B-ZOO-MIRA-PHOENIX` was
      run twice and appeared to hang, the first time for over ten minutes
      before being killed. The diagnosis offered at the time - that it was
      sitting in the API-backed prompt-fill step - was wrong. It never got
      past cmd_prepare's `with repo_lock()`. The lock was held by an
      interactive zsh (PID 7598) started three days earlier on 2026-08-31,
      with the lockfile open on ten descriptors, almost certainly an
      aborted jackpot-loop or cc-jackpot run that leaked the FD. Confirmed
      by fcntl.flock(LOCK_EX | LOCK_NB) returning BlockingIOError; the
      maintainer killed the shell and the lock freed immediately.

      The defect is not the leaked FD - that will happen again whenever a
      session is aborted mid-lock. The defect is that a held lock and slow
      work produce identical output, so the only way to tell them apart is
      to know to reach for lsof and fcntl. That is the Critical Rule 74
      shape applied to a tool rather than a test: the failure mode is
      silence, and silence is what success also looks like.

      Fix: try flock(LOCK_EX | LOCK_NB) first. On BlockingIOError, print
      the holding PID and its start time (lsof on the lockfile, or
      psutil), then either block with a visible "waiting for <pid>"
      message or exit non-zero with instructions. A --force or
      --lock-timeout flag is worth considering but is not the point; the
      point is that the tool should say what it is waiting for.

      Note this file's primary_files sit OUTSIDE the jackpot repo, in
      ~/Projects/operation_jackpot/scripts_jackpot/. No other entry does
      that. scripts/check_backlog.py does not validate path existence, so
      it passes, but if a future guard starts checking paths this entry is
      the one that breaks - move it to a tooling backlog then rather than
      deleting the record.

      Shipped 2026-09-03 as d0d960f. That SHA is in the scripts_jackpot
      repo, NOT this one - scripts_jackpot is local-only with no remote, so
      there is no PR and no merge commit here to point at. A reader who
      greps this repo's history for d0d960f will find nothing; that is
      expected, not a broken record.

      repo_lock now tries LOCK_EX | LOCK_NB first and, on contention,
      prints each holder's pid, start time and command before falling back
      to the same blocking acquire. Behaviour is unchanged for a caller
      that simply has to wait. _lock_holders is diagnostics-only: every
      failure path returns [] rather than raising, so a missing lsof cannot
      stop the caller taking the lock. Three tests drive a subprocess that
      really holds an flock rather than a mock, and were confirmed to
      discriminate by reverting to the pre-fix form - the contended test
      goes red, the uncontended one stays green.

      Left undone, and worth its own entry: test_jackpot_batch.py's
      TestWorktreePath::test_matches_every_zsh_worktree_literal fails
      because ~/.zshrc now builds the worktree path from ${slug} while the
      test expects ${branch}. Pre-existing, unrelated to the lock, and
      exactly the zsh/python drift that test exists to catch.

  - id: B-STORAGE-LOCAL-FALLTHROUGH
    title: Selecting local filesystem storage silently yields a GCS client
    short_description: |
      storage_backend="local" is the ScenarioDefaults default and is chosen
      by two shipped scenarios. init writes STORAGE_ENDPOINT= (empty) for
      it, and factory.py branches on `if settings.storage_endpoint:` -
      falling through to S3StorageBackend against
      https://storage.googleapis.com. An operator who asks for local
      filesystem storage gets a cloud client, with no error and no warning.
    phase: p0_series
    status: shipped
    merged_at: "2026-09-04"
    merge_sha: "TBD"
    depends_on: []
    blocked_by_external:
    parallel_safe: true
    parallel_safe_reason: "Storage factory plus one CLI writer branch. No authorization path, no schema, no migration."
    effort_sessions: 1
    primary_files:
      - backend/backend/storage/factory.py
      - backend/backend/storage/local.py
      - cli/jackpot/init/writers.py
      - schema/jackpot_scenarios/scenarios.py
    test_files:
      - tests/storage/test_factory_selection.py
      - tests/storage/test_local.py
    source_of_truth_views:
      - docs/architecture.md
    pr_title_template:
    branch_name_template: "fix/local-storage-fallthrough"
    role_framing:
    notes: >
      Reproduced 2026-09-03, not inferred:

        Settings(storage_endpoint=None) -> get_storage_backend()
        -> S3StorageBackend, endpoint_url=https://storage.googleapis.com

      The chain: scenarios.py:124 defaults storage_backend to "local";
      writers.py:180 emits STORAGE_ENDPOINT= for anything that is not
      minio; factory.py treats empty endpoint as "not S3-compatible,
      therefore GCS via HMAC". Three reasonable-looking steps compose into
      an install that reaches for Google Cloud Storage when the operator
      asked for a directory on disk. LocalFSStorageBackend exists to serve
      exactly this choice and is instantiated by nothing outside tests.

      Two shipped scenarios select storage_backend="local":
      the CI scenario (F) and the tribal-sovereignty deployment. The
      sovereignty profile is the one that matters. A deployment whose
      entire premise is that data does not leave the operator's control
      currently constructs a client aimed at a Google endpoint. It has
      presumably never failed loudly because nothing in CI writes an object
      through the real backend, which is the same reason the reachability
      of LocalFSStorageBackend was never questioned - see
      B-STORAGE-DEAD-BACKENDS.

      CLAUDE.md Critical Rule 56 carries the same misunderstanding: it
      describes instances/ci as using "filesystem storage (STORAGE_ENDPOINT
      empty in .env.local)". Empty STORAGE_ENDPOINT does not select
      filesystem storage; it selects GCS. The rule needs correcting in the
      same change, or it will re-teach the bug to the next reader.

      Fix shape, to be confirmed against docs/architecture.md 159 and 418
      which both list local filesystem as an install-time storage option:
      factory.py needs an explicit branch on the selected backend rather
      than an inference from endpoint emptiness. That likely means
      Settings carries storage_backend as a first-class value instead of
      the factory guessing from STORAGE_ENDPOINT. Wire LocalFSStorageBackend
      to it. Do NOT "fix" this by deleting local.py.

      Add a test asserting the selection matrix directly - each
      storage_backend value maps to the class and endpoint it should - so
      the mapping stops being a property nobody can see. The absence of
      such a test is why three composable steps went unnoticed.

      SHIPPED 2026-09-04. Settings gained storage_backend (Literal, default
      None), local_storage_root and local_storage_public_url_base;
      factory.py branches on the named choice and builds
      LocalFSStorageBackend for "local", raising StorageError naming
      local_storage_root when it is unset. storage_backend=None keeps the
      old inference so a config predating the setting is unchanged - the
      inference survives only as a compatibility path, never as the way a
      backend is chosen.

      credentials/registry.py's local_storage_presign_secret predicate was
      the "flip this when storage_factory grows that backend" placeholder;
      it is now `s.storage_backend == "local"`. Whoever wrote C-1 left the
      shape of this fix ready, which is worth noticing: the entry treated
      LocalFSStorageBackend as possibly-dead code when the registry had
      already recorded it as pending work.

      tests/storage/test_factory_selection.py asserts the matrix directly.
      Its helper pins every selection-relevant field rather than
      inheriting them, because tests/conftest.py:54 sets STORAGE_ENDPOINT
      for the whole session - the legacy-inference test passed for the
      wrong reason on its first run. Confirmed to discriminate: removing
      the local branch reddens exactly the three local tests.

      NOT done here, deliberately. instances/ci/.env.local still carries
      only an empty STORAGE_ENDPOINT, so the CI instance resolves through
      the legacy path rather than filesystem storage. Making it genuinely
      local needs STORAGE_BACKEND, LOCAL_STORAGE_ROOT and a committed
      presign secret, and nothing in .github/workflows/ consumes that file
      (only cli/tests/ reference instances/ci), so the change would be
      unverifiable by CI. Critical Rule 56 now states this rather than
      asserting filesystem storage it does not have. Also not done:
      cli/jackpot/init/writers.py emits STORAGE_BACKEND into the Helm
      values payload only, never into .env.local, so `jackpot init` still
      cannot produce a filesystem-backed Compose install. Both are
      B-STORAGE-CI-LOCAL.

      Review found the fix was HALF DONE, which is the lesson worth
      keeping. The same predicate lived in three places and only the
      factory was corrected: get_uri_prefix() still answered "gs" from an
      empty storage_endpoint, so a local install wrote bytes to disk and
      recorded gs://jackpot-staging/<key> against the sample. Wrong
      provenance persisted to the database is worse than a wrong client -
      a sovereignty deployment would have claimed its data sat in Google's
      cloud. S3StorageBackend.get_uri() was a third answer again,
      hardcoding s3:// even when serving GCS.

      Now: get_backend_type() is the single resolver, the factory
      dispatches on it, get_uri_prefix() is deleted, and stage_file(),
      move_to_sequences() and the execution-log uploader ask
      backend.get_uri(key) instead of assembling {prefix}://{bucket}/{key}
      themselves. Critical Rule 73 - and a reminder that "grep every
      caller of the thing you are about to change" applies to predicates,
      not just functions. The first pass changed one caller of an idea.

  - id: B-STORAGE-CI-LOCAL
    title: Nothing can actually produce a filesystem-backed install yet
    short_description: |
      The backend can now select local storage (B-STORAGE-LOCAL-FALLTHROUGH)
      but nothing emits the config that selects it. jackpot init writes
      STORAGE_BACKEND into the Helm values payload only, never into
      .env.local, so a Compose install cannot ask for filesystem storage.
      instances/ci/.env.local still carries only an empty STORAGE_ENDPOINT
      and resolves through the legacy inference.
    phase: p0_series
    status: open
    depends_on: ["B-STORAGE-LOCAL-FALLTHROUGH"]
    blocked_by_external:
    parallel_safe: true
    parallel_safe_reason: "CLI writer plus one committed instance dir. No backend module, no schema, no migration."
    effort_sessions: 1
    primary_files:
      - cli/jackpot/init/writers.py
      - instances/ci/.env.local
      - CLAUDE.md
    test_files:
      - cli/tests/test_init_writers.py
    source_of_truth_views: []
    pr_title_template:
    branch_name_template: "fix/init-emits-storage-backend"
    role_framing:
    notes: >
      Split out of B-STORAGE-LOCAL-FALLTHROUGH on 2026-09-04 rather than
      bundled into it, because the two halves have different risk. The
      backend half is covered by tests/storage/test_factory_selection.py
      and provable in-process. This half is not verifiable by CI at all,
      which is the finding as much as the fix.

      writers.py:258 puts STORAGE_BACKEND in the Helm values dict.
      writers.py:180 writes .env.local and emits STORAGE_ENDPOINT with no
      companion STORAGE_BACKEND line. So `jackpot init --scenario A` (or
      the sovereignty scenario, which defaults storage_backend="local")
      produces a Compose env that cannot name its own backend, and the
      backend falls back to inference. Scenario A defaults to minio so it
      works by accident; the sovereignty scenario does not.

      instances/ci/.env.local needs STORAGE_BACKEND=local,
      LOCAL_STORAGE_ROOT, and a presign secret before Critical Rule 56's
      "filesystem storage" description becomes true. The secret is
      committable under the same reasoning Rule 56 already applies to the
      fixed JWT signing key, but note it must be at least 32 characters or
      LocalFSStorageBackend raises at construction.

      The uncomfortable part, worth confirming before doing the work:
      nothing in .github/workflows/ reads instances/ci/.env.local. Only
      cli/tests/ reference instances/ci at all. So Scenario F's committed
      artifact set - the thing Rule 56 describes as producing reproducible
      green CI runs - is not what CI runs. Either wire it up or stop
      describing it that way; changing the storage lines without settling
      that just moves an unverified claim to a new value.

  - id: B-STORAGE-DEAD-BACKENDS
    title: GCSStorageBackend has no production caller - wire it or delete it
    short_description: |
      backend/backend/storage/ ships four backend classes and factory.py
      instantiates one: S3StorageBackend, in both branches. GCSStorageBackend
      is referenced only by its own definition and by tests, and GCS already
      works through the S3-compatible HMAC path, so a native client needs a
      justification beyond symmetry. Decide: wire it or delete it.
      LocalFSStorageBackend is NOT in scope here - it is unwired because of a
      live defect, tracked as B-STORAGE-LOCAL-FALLTHROUGH.
    phase: p0_series
    status: open
    depends_on: ["B-STORAGE-LOCAL-FALLTHROUGH"]
    blocked_by_external:
    parallel_safe: true
    parallel_safe_reason: "Storage layer only. No authorization path, no schema, no migration."
    effort_sessions: 1
    primary_files:
      - backend/backend/storage/factory.py
      - backend/backend/storage/gcs.py
      - backend/backend/credentials/registry.py
    test_files:
      - tests/storage/test_gcs.py
      - tests/storage/test_base.py
    source_of_truth_views:
      - docs/architecture.md
    pr_title_template:
    branch_name_template: "refactor/storage-backend-reachability"
    role_framing:
    notes: >
      Found 2026-09-03 while rejecting drs:// (B-DRS-URI-1). The
      justification written for that change said storage "ships gcs, s3 and
      local backends", which is true of the modules and false of the
      reachable code. Every URI JACKPOT can actually open is opened by
      S3StorageBackend.

      This is the Critical Rule 70 shape turned inward: two modules that
      read as live infrastructure, are covered by their own passing tests,
      and cannot be reached from any production entry point. The tests are
      what make it invisible - test_gcs.py and test_local.py are green, so
      nothing signals that the thing under test is unreachable. Coverage
      counts them as exercised.

      credentials/registry.py:89 already carries the admission in a
      comment - "No factory branch instantiates LocalFSStorageBackend yet;
      flip this" - so the fact was known, written down once, in the one
      place nobody looks for a storage question.

      NARROWED 2026-09-04, before any session ran against it. The original
      entry lumped LocalFSStorageBackend in as possible dead code and the
      generated prompt turned that into an explicit instruction: if
      architecture.md does not name the backend, delete local.py and its
      tests. Inspecting the prompt is what caught it.

      LocalFSStorageBackend is not dead code. It is the backend that should
      serve storage_backend="local" - the ScenarioDefaults default, selected
      by the CI and tribal-sovereignty scenarios - and the reason nothing
      instantiates it is a defect, now tracked as
      B-STORAGE-LOCAL-FALLTHROUGH. Deleting it would have removed the fix
      for a live bug inside a PR captioned as tidy-up. This entry depends on
      that one so the ordering cannot be lost.

      What remains here is GCSStorageBackend alone, and it is a genuine
      question rather than a defect: GCS is already reachable through the
      S3-compatible HMAC path, so the native client either earns a factory
      branch for a reason someone can state, or it goes. Leaving it exactly
      as it is - present, tested, unreachable - is the one outcome to avoid,
      because its own green tests make the unreachability invisible and
      coverage counts it as exercised.

  - id: B-ZOO-WRAPPER-CONTRACT
    title: Document the three registration points a new zoo wrapper must hit
    short_description: |
      pipelines/pipelines/README.md describes what an existing wrapper
      contains and what the shared tests load, but not what a NEW wrapper
      has to register. That contract - a per-wrapper test file, a
      PipelineCase row backed by a fixture tree, and a _WRAPPED_PIPELINES
      row - currently exists only in one backlog entry's notes.
    phase: p0_series
    status: shipped
    merged_at: "2026-09-04"
    merge_sha: "5b30742"
    depends_on: []
    blocked_by_external:
    parallel_safe: true
    parallel_safe_reason: "One README. No code."
    effort_sessions: 0.5
    primary_files:
      - pipelines/pipelines/README.md
    test_files: []
    source_of_truth_views: []
    pr_title_template:
    branch_name_template: "docs/zoo-wrapper-contract"
    role_framing:
    notes: >
      Split out of B-ZOO-MIRA-PHOENIX on 2026-09-03 rather than left in it.
      The three registration points were discovered twice in one session -
      the first correction to that entry named the wrong test paths, the
      second named all three - and both times the cost was that the
      information had no general home. A per-item entry is the wrong place
      for a contract every future wrapper must satisfy; the next author
      will read the README, not a backlog entry for two CDC pipelines.

      What to document:

        1. pipelines/tests/test_<name>_parsers.py - a per-wrapper test file.
           All ten wrappers have one.
        2. A PipelineCase row in _PIPELINE_CASES in
           test_pipeline_integration_e2e.py, plus a fixture tree at
           pipelines/tests/fixtures/<name>/. A row without a fixture fails
           an explicit assertion; expects_results additionally catches a
           fixture that parses to nothing.
        3. A (module, upstream) row in _WRAPPED_PIPELINES in
           test_version_check.py, which parametrizes over it.

      Worth stating the fixture bar too, because it is lower than it looks
      and the wrong guess in either direction is expensive. The 54
      committed fixture files are hand-written, not captured runs -
      synthetic values in genuinely real formats. The mycosnp Snippy
      fixture is real snippy 4.6.0 key/value shape with a fabricated
      timestamp and invented variant counts. So a new wrapper needs correct
      directory nesting, correct output filenames and real TSV header
      lines; it does not need a pipeline execution.

      Note the README itself sits outside scripts/check_docs.py, which
      scans docs/ plus repo-root markdown only. That is how its previous
      text drifted from Session J to 2026-09-03 without tripping anything
      (fixed in PR #210). Widening the guard is a separate decision -
      B-DOC-GUARD-SCOPE drew that line deliberately.

      Shipped 2026-09-04 as 5b30742. Writing it turned up something the
      entry did not predict: only ONE of the three registration points is
      enforced. test_pipeline_integration_e2e.py checks both directions -
      a wrapper on disk missing from _PIPELINE_CASES fails, and a matrix
      row without a fixture directory fails. Neither the per-wrapper
      test_<name>_parsers.py nor the _WRAPPED_PIPELINES row has any
      disk-completeness check, so omitting either is silent: the parsers
      simply go untested, or the version gate that test_version_check.py
      exists to provide is bypassed, and the suite stays green both times.

      Critical Rule 74 again, in the zoo's own test registries. The README
      now states the asymmetry, which makes the prose a stand-in for two
      missing guards rather than a description of a uniform contract.
      Giving those registries real completeness checks is the follow-up
      worth having, and would let the README go back to being a summary.

      Written directly rather than through jackpot-batch: the batch run
      refused to launch because its sandbox canary found claude cannot
      reach the API from inside srt. See B-BATCH-SRT-REGRESSION.

  - id: B-BATCH-SRT-REGRESSION
    title: Headless batch sessions cannot reach the API from inside the srt sandbox
    short_description: |
      jackpot_batch.py run wraps each headless `claude -p` session in srt
      (Anthropic Sandbox Runtime) for filesystem and network isolation. As
      of srt 1.0.0 with Claude Code 2.1.259, claude cannot reach
      api.anthropic.com from inside the sandbox - node's fetch ignores
      srt's proxy env and direct DNS is blocked. Every batch run is
      therefore blocked, or must drop isolation with --no-sandbox.
    phase: p0_series
    status: open
    depends_on: []
    blocked_by_external: "Upstream fix in srt or Claude Code; neither is in this repo."
    parallel_safe: true
    parallel_safe_reason: "Tooling outside the repo tree. Touches no backend module."
    effort_sessions: 0.5
    primary_files:
      - "~/Projects/operation_jackpot/scripts_jackpot/jackpot_batch.py"
    test_files:
      - "~/Projects/operation_jackpot/scripts_jackpot/test_jackpot_batch.py"
    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Observed 2026-09-04 on srt 1.0.0 and Claude Code 2.1.259, running
      `jackpot-batch run` against a single approved prompt:

        ✗ Sandbox canary failed: API Error: Can't reach the API server
          (FailedToOpenSocket)

      Nothing ran. The preflight canary makes a minimal sandboxed claude
      call before trusting the sandbox, so the failure was loud and cost
      nothing - worth noting because it is the opposite of the
      B-BATCH-LOCK-DIAG failure mode, and the same tooling. A check that
      proves it can work before relying on it is the pattern Critical Rule
      74 asks for, already present here.

      The srt block comment in jackpot_batch.py records that gh auth and
      api.anthropic.com both worked through the sandbox when it was
      verified on 2026-08-28, so this is a regression in one of the two
      tools rather than a misconfiguration. Note the comment is a dated
      verification record, which is why it can be trusted here - and why
      re-verifying on each version bump is the point.

      Until it is fixed the options are: run --no-sandbox, which drops
      filesystem AND network isolation for an agent holding push, PR and
      merge rights over the repo; or do the work directly. The second is
      correct for single small items and was taken for
      B-ZOO-WRAPPER-CONTRACT. The first should not become habitual - the
      isolation is what makes an unattended agent with merge rights
      acceptable, and "reviewed prompts only" is a weaker guarantee than
      it sounds given three prompts this week were reviewed and still
      wrong.

      What to do here is not obvious and should not be guessed: pin the
      working srt/claude pair, wait for an upstream fix, or replace srt
      with another isolation mechanism. Re-test with the canary after any
      version bump before assuming it is resolved.

  - id: B-EUK-COINFECT-SENTINEL
    title: '"Screened, none found" sentinel for coinfection_organisms'
    short_description: |
      Decide how to represent "screened for coinfection, none found" so
      coinfection_organisms can become a tier-3 requirement again without
      forcing submitters to invent a value.
    phase: p0_series
    status: tracked_not_scheduled
    depends_on: []
    blocked_by_external: "Phase 28 (default eukaryotic pathogen pipelines)"
    parallel_safe: true
    effort_sessions: 1
    primary_files:
      - schema/schema/jackpot_schema.yaml
      - backend/backend/validator.py
    test_files:
      - tests/test_validator_eukaryotic.py
    source_of_truth_views: []
    pr_title_template:
    branch_name_template:
    role_framing:
    notes: >
      Split out of B-EUK-3 on 2026-08-28. byop design section 15 listed
      coinfection_organisms as a tier-3 field; it is deliberately not enforced
      as one because _is_absent() treats [] as missing and CSV ingest
      collapses an empty cell to [] (routers/ingest.py _split_list), making
      "screened, no coinfection" indistinguishable from "not recorded". The
      field is still accepted and stored.

      Recording coinfection matters -- mixed-species Plasmodium infection is
      epidemiologically significant -- so this is deferred, not dropped. The
      schema already uses the INSDC missing-value convention (missing / not
      applicable / not collected) for indoor_space and indoor_surface, so
      there is house precedent for a sentinel. Open sub-decision: sentinel
      value inside OrganismNameEnum vs a companion coinfection_screened
      boolean. Sequence it with Phase 28, when the malaria dashboards define
      what they actually query. Requires gen-pydantic regeneration plus the
      boolean-keyword patch (Critical Rules 3 and 20).

  - id: B-PERMGROUPS-DROP
    title: Retire permission_groups, or decide not to — the Rule 1 / §10.1 conflict
    short_description: |
      access_model.md §10.1 lists "the six-value APGAP permission-group enum
      on lab_membership rows" among three things deleted outright by the
      greenfield migration. CLAUDE.md Critical Rule 1 declares the same six
      names sacred and forbids renaming them. Both are checked-in and
      reviewed; they cannot both be followed. Someone has to decide which,
      and M2-DROP deliberately did not.
    phase: access_model_redesign
    status: tracked_not_scheduled
    depends_on:
      - M2-DROP
    blocked_by_external: null
    parallel_safe: false
    effort_sessions: 3
    primary_files:
      - backend/backend/authz/reseed.py
      - backend/backend/routers/labs.py
      - backend/backend/routers/auth.py
      - backend/backend/routers/users.py
      - backend/backend/auth/guards.py
    test_files:
      - tests/authz/preflight.py
      - tests/test_lab_lead_member_management.py
    source_of_truth_views:
      - docs/access_model.md
      - CLAUDE.md
    pr_title_template: null
    branch_name_template: null
    role_framing: null
    notes: |
      Raised 2026-09-02 out of M2-DROP, which scoped itself to its TITLE (the
      two boolean role columns) rather than its short_description (which also
      said "and the PermissionGroups enum"). The reason for the split is not
      caution, it is that the premise is wrong:

      permission_groups is NOT a Postgres enum. It is a table
      (baseline migration 5adf11b77c19:42) with lab_membership.permission_group_id
      as an FK, and it carries 36 references across five backend modules. It
      is the live INPUT to sync_membership_grants — the thing M2-B5 built —
      and to dev-login's four lab roles. §10.1 was written before M2-B5 made
      membership grants derive from it, so "delete outright" describes a
      dependency graph that no longer holds.

      Dropping it inside M2-DROP's irreversible migration would have repeated
      exactly what the M2 entry's own notes record: containing the work on the
      premise that nothing read the columns. It needs its own
      reader-retirement campaign, the way M2-DROP-PRE was for the booleans —
      eight slices, and three of those turned out to be deletions of code
      with no call site.

      What has to be decided FIRST, before any code:

      1. Does §10.1 still mean it? The sentence may simply be stale. If the
         answer is "permission_groups stays and §10.1 is corrected", this item
         is a one-line doc fix and closes. Check that before scoping work.
      2. If it goes, what replaces it as the membership vocabulary?
         sync_membership_grants keys on permission_groups.name via
         MEMBERSHIP_PRESETS; dev-login's _DEV_LOGIN_LAB_ROLES keys on the same
         names; the E-1 UAT matrix drives them. A preset name could serve, but
         then lab_membership needs a column that is not an FK to a table of
         sacred names, and every seeded deployment needs migrating.
      3. Critical Rule 1 has to be amended or the item cannot proceed. It is
         in the binding file and says DO NOT rename. Amending a Critical Rule
         is a deliberate act, not a side effect of a refactor.

      Do not start (2) before (1) is answered. Most of the cost here is
      migrating a vocabulary that may not need to move.

