  # ── File Storage State (P0f lifecycle) ────────────────────────────────────

  FileStorageState:
    description: >
      Lifecycle ownership of a file referenced by sample_files. Determines
      whether JACKPOT controls the bytes (MANAGED, STAGED), references them
      in place (EXTERNAL), keeps a managed copy alongside an external
      original (MIRRORED), or has lost access (BROKEN). Default for ingest
      is EXTERNAL — JACKPOT does not copy bytes on registration. See
      Critical Rule 57.
    permissible_values:
      EXTERNAL:
        description: >
          URI is not under JACKPOT storage control; JACKPOT references the
          file in place and never copies or deletes it. Default for ingest.
      MANAGED:
        description: >
          File lives in JACKPOT-controlled storage. JACKPOT owns the full
          lifecycle including retention enforcement and deletion.
      MIRRORED:
        description: >
          JACKPOT-owned managed copy backed by an external original. Both
          copies exist; original_uri identifies the external source.
      STAGED:
        description: >
          Temporary copy made for a specific pipeline run. Cleaned up by
          the staging-cleanup job after the run completes plus a retention
          window. staged_for_run_id identifies the owning run.
      BROKEN:
        description: >
          External file is no longer accessible (404, permission denied,
          host unreachable). Terminal state — the row is retained for
          audit but the bytes cannot be read.

