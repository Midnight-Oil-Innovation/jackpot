[project]
name = "jackpot-schema"
version = "0.1.0"
description = "JACKPOT LinkML metadata schema + scenario defaults registry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "JACKPOT Maintainers" }]
dependencies = [
    # jackpot_scenarios.scenarios uses pydantic v2 for ScenarioDefaults models
    "pydantic>=2",
]

[project.optional-dependencies]
codegen = [
    # Tools used to regenerate `backend/models_generated.py` and the JSON
    # schema artefact from `schema/jackpot_schema.yaml`. Optional because
    # only the schema maintainer needs them; runtime consumers (backend,
    # cli) just import paths from `jackpot_schema`.
    "linkml==1.7.4",
    "linkml-runtime==1.7.2",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the helper modules + the YAML/JSON data files as package data.
# `jackpot_schema` exposes the LinkML schema paths;
# `jackpot_scenarios` exposes the install-scenario defaults registry +
# detector (P0e Decision 8 — co-located rather than a separate workspace
# member to keep the workspace at 3 members).
packages       = ["jackpot_schema", "jackpot_scenarios"]
include        = ["schema/**/*.yaml", "schema/**/*.json"]
