[project]
name = "jackpot-schema"
version = "0.1.0"
description = "JACKPOT LinkML metadata schema (data + helper module exposing schema paths)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Glen Otero", email = "gotero@linuxprophet.com" }]
dependencies = []

[project.optional-dependencies]
codegen = [
    # Tools used to regenerate `backend/models_generated.py` and the JSON
    # schema artefact from `schema/jackpot_schema.yaml`. Optional because
    # only the schema maintainer needs them; runtime consumers (backend,
    # cli) just import paths from `jackpot_schema`.
    "linkml==1.7.4",
    "linkml-runtime==1.7.2",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the helper module + the YAML/JSON data files as package data
packages       = ["jackpot_schema"]
include        = ["schema/**/*.yaml", "schema/**/*.json"]
