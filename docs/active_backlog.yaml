    role_framing: "Senior engineering collaborator landing the policy-checker module that\nenforces access controls and repeated-query
      detection on the encrypted\nquery path. Per Driver et al. 2024 §3.1, this is a discrete coordinator\ncomponent between
      the federation router and the HE compute backend.\n"
    notes: Per Driver et al. 2024 (Sci Total Environ). Discrete coordinator pattern. Repeated-query detection is a known
