# JACKPOT active backlog — source of truth for currently-actionable sessions.
#
# Lives at: ~/Projects/jackpot/docs/active_backlog.yaml (version-controlled)
#
# Consumed by:
#   - jackpot_next.py        — prints unblocked/blocked candidates
#   - jackpot_gen_prompt.py  — emits session prompt skeletons
#   - jackpot_finish_helper.py — auto-flips status to shipped post-merge
#   - jackpot_backlog_check.py — validates schema + dependency graph
#
# Maintenance: most updates are automated by jackpot-finish. Manual edits
# needed when scoping new entries or adjusting effort/scope mid-flight.
# Keep ordering by phase for readability.
#
# Status values:
#   shipped               PR merged on development, no further work this round
#   open                  Ready to work on (deps met or empty)
#   blocked               Blocked on an internal dep also in this file
#   blocked_external      Blocked on a phase / coalition outside this file
#   tracked_not_scheduled Backlog item, not yet prioritized
#
# Optional fields populated when status: shipped:
#   merged_at: "YYYY-MM-DD"
#   merge_sha: "abc1234"
#
# Last updated: 2026-05-12

