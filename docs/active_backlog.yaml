  - id: B-CWB-POLICY-1
    title: Encrypted-query policy checker module
    short_description: "Discrete policy-checker module sitting between federation router and HE\ncompute backend. Per Driver
      et al. 2024 cryptWWDB design, the computation\ncoordinator must enforce access controls and detect repeated queries
      (a\nside-channel attack vector against HE schemes). Currently this responsibility\nis implicit in the federation router;
      making it a discrete module makes the\npolicy enforcement auditable and testable.\n"
